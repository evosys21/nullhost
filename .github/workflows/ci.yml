# Type checks, tests, the Windows installer and the portable zip on every push and PR.
# A `v*` tag also publishes both as a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # its auto cache calls the runner's global Yarn 1 before corepack is on
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./packages/desktop/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version v$v"; exit 1; }
      - name: Build installer and portable zip
        run: yarn workspace @nullhost/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            packages/desktop/dist/NullHost-Setup-*.exe
            packages/desktop/dist/NullHost-*-portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/download-artifact@v5
        with:
          name: installer
      # NullHost updates itself only from files in a SHA256SUMS.txt signed with this key
      - name: Sign checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          sha256sum NullHost-Setup-*.exe NullHost-*-portable.zip > SHA256SUMS.txt
          node src/packages/desktop/scripts/sign-release.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NullHost-Setup-*.exe NullHost-*-portable.zip SHA256SUMS.txt SHA256SUMS.txt.sig \
            --repo "$GITHUB_REPOSITORY" --title "NullHost ${GITHUB_REF_NAME#v}" --generate-notes
