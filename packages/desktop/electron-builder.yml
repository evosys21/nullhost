# Windows installer for NullHost. `corepack yarn workspace @nullhost/desktop dist`
appId: ch.evo21.nullhost
productName: NullHost
copyright: Copyright © 2026 Andrei Bintintan

directories:
  output: dist
  buildResources: build

# electron-vite bundles main (with @nullhost/core), preload and renderer into out/;
# the packaged app needs no node_modules at all.
files:
  - out/**
  - package.json
asar: true

# Hardening: the same exe runs as the elevated helper, so it cannot be reused as
# a Node runtime or debugger, and only loads its own integrity-checked asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: NullHost
  # The app runs as a normal user. Only its helper (started with one UAC prompt
  # on the first change of a session) writes the hosts file. See src/main/helper.ts.
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  # Always Program Files: the elevated helper and the daily task run this exe with
  # administrator rights, so it must sit where a normal user cannot replace it
  # (a folder picked on another drive is often writable by every user).
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NullHost
  uninstallDisplayName: NullHost
  artifactName: NullHost-Setup-${version}.exe
  # keep config, snapshots and the original hosts file on uninstall
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
